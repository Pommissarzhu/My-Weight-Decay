<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 饮食助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="//unpkg.com/alpinejs" defer></script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans">
    <nav class="bg-white shadow-sm p-4 text-center sticky top-0 z-50 flex justify-between items-center px-6">
        <h1 class="text-xl font-bold text-green-600">🌿 My Weight Decay</h1>
        {% if user %}
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <img src="{{ user.avatar or 'https://ui-avatars.com/api/?name=' + (user.nickname or user.email) }}"
                    class="w-8 h-8 rounded-full object-cover border border-gray-200"
                    onerror="this.src='https://ui-avatars.com/api/?name={{ user.nickname or user.email }}'">
                <span class="text-sm font-medium text-gray-700">{{ user.nickname or user.email }}</span>
            </div>
            <a href="/logout" class="text-sm text-red-500 hover:text-red-700 ml-2">退出</a>
        </div>
        {% endif %}
    </nav>

    <main class="container mx-auto px-4 py-6 max-w-md">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-gray-400 text-sm py-6">
        <p>&copy; 2024 Weight Decay AI</p>
        {% if icp_number %}
        <p class="mt-2">
            <a href="https://beian.miit.gov.cn/" target="_blank" class="hover:text-gray-600 transition-colors">{{
                icp_number }}</a>
        </p>
        {% endif %}
    </footer>
</body>

</html>
