{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-xl shadow-md overflow-hidden mt-6 p-8">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">创建新账户</h2>
        <p class="text-gray-500 text-sm">开启您的健康管理之旅</p>
    </div>

    {% if error %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
        <span class="block sm:inline">{{ error }}</span>
    </div>
    {% endif %}

    <form action="/register" method="POST" class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">邮箱</label>
            <input type="email" name="email" id="email" required
                class="mt-1 block w-full px-3 py-2 rounded-md border-gray-300 border shadow-sm focus:border-green-500 focus:ring-green-500">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">密码 (ASCII字符, max 14位)</label>
            <input type="password" name="password" id="password" required maxlength="14"
                class="mt-1 block w-full px-3 py-2 rounded-md border-gray-300 border shadow-sm focus:border-green-500 focus:ring-green-500">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="age" class="block text-sm font-medium text-gray-700">年龄</label>
                <input type="number" name="age" id="age" required
                    class="mt-1 block w-full px-3 py-2 rounded-md border-gray-300 border shadow-sm focus:border-green-500 focus:ring-green-500">
            </div>
            <div>
                <label for="gender" class="block text-sm font-medium text-gray-700">性别</label>
                <select name="gender" id="gender" required
                    class="mt-1 block w-full px-3 py-2 rounded-md border-gray-300 border shadow-sm focus:border-green-500 focus:ring-green-500">
                    <option value="Male">男</option>
                    <option value="Female">女</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="height" class="block text-sm font-medium text-gray-700">身高 (cm)</label>
                <input type="number" step="0.1" name="height" id="height" required
                    class="mt-1 block w-full px-3 py-2 rounded-md border-gray-300 border shadow-sm focus:border-green-500 focus:ring-green-500">
            </div>
            <div>
                <label for="weight" class="block text-sm font-medium text-gray-700">体重 (kg)</label>
                <input type="number" step="0.1" name="weight" id="weight" required
                    class="mt-1 block w-full px-3 py-2 rounded-md border-gray-300 border shadow-sm focus:border-green-500 focus:ring-green-500">
            </div>
        </div>

        <div>
            <label for="target_weight" class="block text-sm font-medium text-gray-700">目标体重 (kg)</label>
            <input type="number" step="0.1" name="target_weight" id="target_weight" required
                class="mt-1 block w-full px-3 py-2 rounded-md border-gray-300 border shadow-sm focus:border-green-500 focus:ring-green-500">
        </div>

        <div class="pt-2">
            <button type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150 ease-in-out">
                注册
            </button>
        </div>

        <div class="text-center text-sm">
            <span class="text-gray-500">已有账户?</span>
            <a href="/login" class="font-medium text-green-600 hover:text-green-500">立即登录</a>
        </div>
    </form>
</div>
{% endblock %}
